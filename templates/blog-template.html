<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{ title | default('Untitled') }}</title>
        <link rel="stylesheet" href="/css/index.css" class="style" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap"
            rel="stylesheet"
        />

        {% if has_math %}
        <!-- Conditional KaTeX Assets -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/katex@0.18.6/dist/katex.min.css"
            integrity="sha384-M59ezskvvpvT+a+C1x088YJ3DVmK+wZdX0UkVKalOI4Qi5Nwv0WrvpqHcfa2HQqB"
            crossorigin="anonymous"
        />

        <script
            defer
            src="https://cdn.jsdelivr.net/npm/katex@0.18.6/dist/katex.min.js"
            integrity="sha384-7jGyG5zFwmEamqNWdCbpsPn+GTWEis3lnV7X/jXHyhFpJG7ExABLyMapabg8F4+p"
            crossorigin="anonymous"
        ></script>

        <script
            defer
            src="https://cdn.jsdelivr.net/npm/katex@0.18.6/dist/contrib/auto-render.min.js"
            integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz"
            crossorigin="anonymous"
        ></script>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                renderMathInElement(document.body, {
                    delimiters: [
                        { left: "$$", right: "$$", display: true },
                        { left: "$", right: "$", display: false },
                        { left: "\\(", right: "\\)", display: false },
                        { left: "\\[", right: "\\]", display: true },
                    ],
                    throwOnError: false,
                });
            });
        </script>
        {% endif %}

    </head>

    <body>
        <header>
            <h3>scrumpeh</h3>
            <nav>
                <a href="/">Home</a>
                <a href="/projects/">Projects</a>
            </nav>
        </header>

        <section class="heading">
            <h1>{{ title }}</h1>
            <p class="date">
                {% if date %}{{ date }}{% endif %}
            </p>
        </section>

        <main>
            <article>
                {{ body }}
            </article>
        </main>

        <footer></footer>
    </body>
</html>
